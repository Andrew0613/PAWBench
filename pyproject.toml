[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pawbench"
version = "0.1.0"
description = "PAWBench: outcome-distribution evaluation of physical-scene video generation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "PAWBench contributors" }]
keywords = ["benchmark", "video-generation", "evaluation", "physical-scenes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Public evaluation and the deterministic metric land in later release steps.
# This contracted package has no runtime dependency or download surface.
dependencies = []

[project.optional-dependencies]
eval = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Andrew0613/PAWBench"
Issues = "https://github.com/Andrew0613/PAWBench/issues"

[tool.hatch.build.targets.wheel]
packages = ["pawbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
