schema_version: paweval.rubric/v1
axis: outcome
scene_id: BS-04
track: track_b
title_en: Card Placement on Card Tower
outcome_question: Which label in ['tower_stable_card_placed', 'placed_card_falls_tower_stable',
  'top_section_collapse', 'side_section_collapse', 'full_collapse'] is visible as
  the terminal tower/card response after the placement action?
readout_policy: Read after the held card contacts or is placed onto the card tower
  and the continuous tower/card response in that action window has settled enough
  to classify stable placement, placed-card fall with tower stable, localized collapse,
  or full collapse. Do not classify immediate sway or transient early stability.
  If the placed card falls and the tower later collapses as part of the same continuous
  response, classify the tower collapse rather than the earlier placed-card fall.
canonical_labels:
- tower_stable_card_placed
- placed_card_falls_tower_stable
- top_section_collapse
- side_section_collapse
- full_collapse
label_aliases: {}
unreadable_rules:
- Evidence frames are occluded or cropped such that the canonical label cannot be
  determined.
- Heavy motion blur prevents identifying the canonical label in any qualifying frame.
- None of the canonical labels ['tower_stable_card_placed', 'placed_card_falls_tower_stable',
  'top_section_collapse', 'side_section_collapse', 'full_collapse'] can be decisively
  identified within the readout window.
out_of_schema_rules:
- If disappearance, duplication, or teleportation prevents identifying a canonical label, return `unreadable`; if a readable label is already established, preserve the outcome and leave continuity failure to trustworthiness. Use out-of-schema only for visible events outside this rubric.
- A post-action event occurs that is neither in canonical_labels nor in the scene's
  reference protocol; record it as out-of-schema.
priority_rules:
- 'Readout timing: read after the held card contacts or is placed onto the card tower
  and the terminal tower/card response in the same action window is visible.'
- '`full_collapse` has highest priority when the card tower loses global structure;
  `top_section_collapse` or `side_section_collapse` apply to localized collapse.'
- '`placed_card_falls_tower_stable` requires the placed card to fall while the rest
  of the tower remains standing; `tower_stable_card_placed` requires the new card
  to remain placed and the tower to stay stable.'
- 'Tie-break: tower collapse outranks placed-card fall; if the hand never places
  the card on the tower or the contact point is hidden, return `unreadable`.'
- Terminal collapse/displacement overrides transient stability; a placed card that
  falls before any tower collapse is `placed_card_falls_tower_stable`, but any later
  continuous tower collapse in the same response window outranks it.
notes:
- 'Track B: use metadata-derived priority rules, not a family template.'
- 'Scene title: Card Placement on Card Tower.'
