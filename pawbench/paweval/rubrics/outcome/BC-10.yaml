schema_version: paweval.rubric/v1
axis: outcome
scene_id: BC-10
track: track_b
title_en: Paper Airplane Landing Zones
outcome_question: Which label in ['red_zone', 'blue_zone', 'green_zone', 'yellow_zone',
  'gray_zone', 'outside_mat'] is visible as the first decisive post-action result?
readout_policy: Read the first decisive post-action result window after the requested
  action completes. Qualifying frames are those where the relevant evidence is in
  view and no longer in transition. Use the scene protocol's first-decisive-window
  rule; terminal stability is not required unless the protocol names it.
canonical_labels:
- red_zone
- blue_zone
- green_zone
- yellow_zone
- gray_zone
- outside_mat
label_aliases: {}
unreadable_rules:
- Evidence frames are occluded or cropped such that the canonical label cannot be
  determined.
- Heavy motion blur prevents identifying the canonical label in any qualifying frame.
- None of the canonical labels ['red_zone', 'blue_zone', 'green_zone', 'yellow_zone',
  'gray_zone', 'outside_mat'] can be decisively identified within the readout window.
out_of_schema_rules:
- If disappearance, duplication, or teleportation prevents identifying a canonical label, return `unreadable`; if a readable label is already established, preserve the outcome and leave continuity failure to trustworthiness. Use out-of-schema only for visible events outside this rubric.
- A post-action event occurs that is neither in canonical_labels nor in the scene's
  reference protocol; record it as out-of-schema.
priority_rules:
- First decisive readout is the paper airplane final nose/tip position relative to
  the colored landing mat zones after the one throw.
- Use the final resting nose/tip zone, not first floor contact. `outside_mat` applies
  only when the final nose/tip is outside all colored/gray mat regions.
- 'Zone priority is geometric: red/blue/green/yellow/gray by visible final zone containing
  the nose/tip; do not relabel from wing/body overlap if the nose is readable.'
- 'Tie-break: if the nose/tip straddles a boundary or is hidden, return `unreadable`;
  if only the body is visible but nose is off-screen, return `unreadable`.'
notes:
- 'Contact/trajectory scene: outcome label uses first decisive visible target interaction
  or miss geometry.'
- 'Track B finalized content: scene-specific readout, priority, and tie-break rules
  are authored from STAGBench metadata/action protocol.'
- 'Scene title: Paper Airplane Landing Zones.'
