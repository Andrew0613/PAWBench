# manual bridge rubric for 0049 legacy Track B scene
schema_version: paweval.rubric/v1
axis: trustworthiness
scene_id: TB-02
track: track_b
title_en: Ball Toss Into Cup (Legacy TB-02)
scene_grounding:
- 'Initial state must match: a hand holds one ball near a cup on a table.'
- The cup, ball, hand, and tabletop layout must remain recognizable from the source image.
action_execution:
- 'Required action: throw or toss the visible ball once toward the cup.'
- The action must happen once as a continuous visible event from the described initial
  state; cuts, hidden starts, or repeated attempts are action-execution failures.
- The cup must be the intended target of the toss.
target_requirements:
- Cup mouth/rim and tossed ball must be visible at release, flight, and terminal
  readout whenever possible.
- A terminal IN_CUP label requires the ball to visibly end inside the cup.
- A terminal OUT_OF_CUP label can include rim contact, bounce out, near miss, or
  clear miss, provided the final relation is visible.
object_continuity:
- The judged ball and cup must not disappear, duplicate, teleport, or swap identity.
- Color, scale, and identity of the judged ball and cup must remain consistent across
  the readout window.
apparatus_stability:
- The cup, table plane, and camera framing must not drift, resize, or change in a
  way that changes the possible final relation.
motion_hard_failures:
- 'Teleport: the ball moves across space without a continuous trajectory.'
- 'Target swap: the ball is redirected to a different target after release.'
- 'Post-result jump: the ball jumps into or out of the cup after the first stable
  terminal relation without visible physical contact.'
post_result_consistency:
- Post-result frames must remain physically consistent with the terminal relation.
- The ball must not enter, leave, duplicate, or vanish from the cup through impossible
  motion after the first stable terminal readout.
severity_rules:
  fatal_for_strict_trusted:
  - SCENE_GROUNDING_FAIL
  - ACTION_EXECUTION_FAIL
  - TARGET_MISS
  - OBJECT_ACQUISITION_FAIL
  - OBJECT_CONTINUITY_FAIL
  - TRAJECTORY_INVALID
  - APPARATUS_INSTABILITY
  - POST_RESULT_INCONSISTENCY
  nonfatal_warnings:
  - MINOR_VISUAL_ARTIFACT
  - READOUT_AMBIGUITY
notes:
- Legacy 0049 `TB-02` uses a binary terminal relation. Keep readable labels in the
  relaxed distribution and use this trust axis to separate physical credibility.
