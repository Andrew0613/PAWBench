# manual bridge rubric for 0049 legacy Track B scene
schema_version: paweval.rubric/v1
axis: trustworthiness
scene_id: TB-14
track: track_b
title_en: Table Tennis Serve (Legacy TB-14)
scene_grounding:
- 'Initial state must match: a player holds a paddle and ball near a table-tennis
  table and net.'
- The table, net, paddle, ball, and serving hand must remain recognizable from the
  source image.
action_execution:
- 'Required action: serve the ball once toward the table and net.'
- The serve must happen once as a continuous visible event from the described initial
  state; cuts, hidden starts, or repeated attempts are action-execution failures.
- The table and net must be the intended target region of the serve.
target_requirements:
- The ball, paddle, table surface, and net must be visible enough to audit the decisive
  serve result.
- A NET label requires visible net contact or a visibly net-caused failure.
- An ON_TABLE label requires visible valid table contact in the target area.
- An OUT label requires the ball to visibly miss or leave the valid table area.
object_continuity:
- The judged ball, paddle, table, and net must not disappear, duplicate, teleport,
  or swap identity.
- Fast ball motion must be judged from a plausible visible trajectory, not a before/after
  object appearing at the target.
apparatus_stability:
- Table, net, camera framing, and scale must stay fixed enough to judge valid landing,
  out, or net contact.
motion_hard_failures:
- 'Teleport: the ball moves across space without a continuous trajectory.'
- 'Target swap: the serve is redirected to a different target or unrelated object.'
- 'Post-result change: the ball changes from net/out/on-table to another state after
  a decisive readout without continuous visible motion.'
post_result_consistency:
- Post-result frames must remain physically consistent with the decisive serve result.
- The ball must not cross the net, return to the table, vanish, duplicate, or reverse
  outcome through impossible motion after the first decisive readout.
severity_rules:
  fatal_for_strict_trusted:
  - SCENE_GROUNDING_FAIL
  - ACTION_EXECUTION_FAIL
  - TARGET_MISS
  - OBJECT_ACQUISITION_FAIL
  - OBJECT_CONTINUITY_FAIL
  - TRAJECTORY_INVALID
  - APPARATUS_INSTABILITY
  - POST_RESULT_INCONSISTENCY
  nonfatal_warnings:
  - MINOR_VISUAL_ARTIFACT
  - READOUT_AMBIGUITY
notes:
- Legacy 0049 `TB-14` uses a three-way serve outcome space. Keep readable labels
  in the relaxed distribution and use this trust axis to separate physical credibility.
